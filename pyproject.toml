[project]
name = "quantbot"
version = "0.1.0"
description = "A systematic trading research platform: signal research, event-consistent backtesting, and paper trading."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "scipy>=1.12",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4"]
live = ["alpaca-py>=0.20", "python-dotenv>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
quantbot = "quantbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantbot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The dashboard renders an inline HTML/CSS template; long lines are unavoidable.
"scripts/dashboard.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
