name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,ml]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest --cov=quantbot --cov-report=term-missing --cov-report=json --cov-fail-under=80

      - name: Verify coverage badge
        if: matrix.python-version == '3.12'
        run: |
          python scripts/coverage_badge.py
          git diff --exit-code -- docs/coverage.svg

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag quantbot:ci .

      - name: Smoke test CLI and writable report paths
        run: |
          docker run --rm quantbot:ci --help
          docker run --rm quantbot:ci paper-report \
            --database /workspace/state/smoke.sqlite3 \
            --out /workspace/results/paper
